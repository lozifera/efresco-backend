<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Cloudinary - EFresco</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .container { background: #f5f5f5; padding: 30px; border-radius: 10px; }
        h1 { color: #2c5530; text-align: center; }
        .form-group { margin: 20px 0; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #4CAF50; color: white; padding: 12px 30px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .loading { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
        .image-preview { margin-top: 15px; text-align: center; }
        .image-preview img { max-width: 300px; max-height: 300px; border: 2px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 EFresco - Prueba de Cloudinary</h1>
        
        <form id="uploadForm">
            <div class="form-group">
                <label>Email de prueba:</label>
                <input type="email" id="email" value="test@efresco.com" required>
            </div>
            
            <div class="form-group">
                <label>Contraseña de prueba:</label>
                <input type="password" id="password" value="123456" required>
            </div>
            
            <div class="form-group">
                <label>Seleccionar imagen de perfil:</label>
                <input type="file" id="imageFile" accept="image/*" required>
            </div>
            
            <button type="submit">📤 Subir Imagen a Cloudinary</button>
        </form>
        
        <div id="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api';
        let authToken = '';

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const imageFile = document.getElementById('imageFile').files[0];
            
            if (!imageFile) {
                showResult('error', '❌ Por favor selecciona una imagen');
                return;
            }
            
            showResult('loading', '🔄 Iniciando sesión y subiendo imagen...');
            
            try {
                // Paso 1: Login
                const loginResponse = await fetch(`${API_BASE}/usuarios/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                if (!loginResponse.ok) {
                    throw new Error(`Error en login: ${loginResponse.status}`);
                }
                
                const loginData = await loginResponse.json();
                authToken = loginData.token;
                
                showResult('loading', '🔄 Login exitoso! Subiendo imagen a Cloudinary...');
                
                // Paso 2: Subir imagen
                const formData = new FormData();
                formData.append('image', imageFile);
                
                const uploadResponse = await fetch(`${API_BASE}/usuarios/foto-perfil`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });
                
                if (!uploadResponse.ok) {
                    const errorData = await uploadResponse.json();
                    throw new Error(`Error en subida: ${errorData.error || uploadResponse.status}`);
                }
                
                const uploadData = await uploadResponse.json();
                
                showResult('success', `
                    ✅ ¡Imagen subida exitosamente a Cloudinary!<br><br>
                    <strong>📋 Detalles:</strong><br>
                    • URL: <a href="${uploadData.foto_perfil_url}" target="_blank">${uploadData.foto_perfil_url}</a><br>
                    • Tamaño: ${(uploadData.file_info.size / 1024).toFixed(2)} KB<br>
                    • Tipo: ${uploadData.file_info.mimetype}<br>
                    • ID Cloudinary: ${uploadData.file_info.cloudinary_id}<br><br>
                    <strong>🎯 ¡Imagen guardada permanentemente en Cloudinary!</strong>
                    <div class="image-preview">
                        <img src="${uploadData.foto_perfil_url}" alt="Imagen subida" />
                    </div>
                `);
                
            } catch (error) {
                console.error('Error:', error);
                showResult('error', `❌ Error: ${error.message}`);
            }
        });
        
        function showResult(type, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message;
        }
        
        // Verificar estado del servidor al cargar
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_BASE}/usuarios/test`, { method: 'GET' });
                console.log('✅ Servidor funcionando correctamente');
            } catch (error) {
                showResult('error', '❌ No se puede conectar al servidor. Asegúrate de que esté ejecutándose en localhost:3001');
            }
        });
    </script>
</body>
</html>
